<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SheRide Admin Portal</title>
    <script type="text/javascript">
      var path = window.location.pathname;
      var repo = '/sheride-admin';
      var subpath = path.indexOf(repo) === 0 ? path.substring(repo.length) : path;
      if (subpath.charAt(0) === '/') subpath = subpath.substring(1);
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      window.location.replace(window.location.origin + repo + '/#/' + subpath + search + hash);
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #E91E63; font-weight: bold;">
      Redirecting to SheRide Admin Portal...
    </p>
  </body>
</html>
